<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 850" width="100%" height="100%">
  <defs>
    <!-- Subtle drop glow for the shield and pulses -->
    <filter id="sevas-red-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1000" height="850" fill="#000000" />

  <!-- Left ECG Pulse Wave -->
  <path d="M 60 380 L 220 380 L 235 340 L 255 430 L 285 240 L 315 470 L 332 370 L 342 380" 
        fill="none" 
        stroke="#E51B24" 
        stroke-width="18" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Right ECG Pulse Wave -->
  <path d="M 658 380 L 668 370 L 685 470 L 715 240 L 745 430 L 765 340 L 780 380 L 940 380" 
        fill="none" 
        stroke="#E51B24" 
        stroke-width="18" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Red Outer Shield -->
  <path d="M 330 200 C 430 175 500 170 500 170 C 500 170 570 175 670 200 L 670 385 C 670 525 500 625 500 625 C 500 625 330 525 330 385 Z" 
        fill="#04060A" 
        stroke="#E51B24" 
        stroke-width="22" 
        stroke-linejoin="round" />

  <!-- White Car Body Silhouette -->
  <!-- Roof and windshield -->
  <path d="M 435 275 L 565 275 L 610 335 L 390 335 Z" fill="#04060A" />

  <!-- Main Car Body in crisp White -->
  <path d="M 430 270 L 570 270 C 578 270 584 274 588 280 L 624 336 C 632 336 642 342 642 352 L 642 364 C 642 370 636 374 628 374 L 626 385 C 636 400 644 425 640 455 C 636 480 610 495 595 498 L 405 498 C 390 495 364 480 360 455 C 356 425 364 400 374 385 L 372 374 C 364 374 358 370 358 364 L 358 352 C 358 342 368 336 376 336 L 412 280 C 416 274 422 270 430 270 Z" 
        fill="#FFFFFF" />

  <!-- Windshield cutout (dark) -->
  <path d="M 438 282 L 562 282 L 602 334 L 398 334 Z" fill="#04060A" rx="4" />

  <!-- Side mirrors -->
  <rect x="345" y="342" width="22" height="12" rx="4" fill="#FFFFFF" />
  <rect x="633" y="342" width="22" height="12" rx="4" fill="#FFFFFF" />

  <!-- Modern Headlights Cutouts -->
  <polygon points="378,390 432,398 424,420 374,408" fill="#04060A" />
  <polygon points="622,390 568,398 576,420 626,408" fill="#04060A" />

  <!-- Bumper grille line -->
  <path d="M 388 445 L 435 448 M 565 448 L 612 445" stroke="#04060A" stroke-width="6" stroke-linecap="round" />

  <!-- Central Emergency Siren Emblem -->
  <!-- Outer black circular housing with crisp border -->
  <circle cx="500" cy="430" r="62" fill="#000000" stroke="#FFFFFF" stroke-width="6" />

  <!-- Radiating light rays inside top half of emblem -->
  <g stroke="#FFFFFF" stroke-width="4" stroke-linecap="round">
    <line x1="500" y1="384" x2="500" y2="396" />
    <line x1="472" y1="392" x2="480" y2="402" />
    <line x1="528" y1="392" x2="520" y2="402" />
    <line x1="452" y1="412" x2="463" y2="418" />
    <line x1="548" y1="412" x2="537" y2="418" />
  </g>

  <!-- Emergency Siren Beacon (Red) -->
  <path d="M 482 458 L 518 458 C 518 458 522 436 512 422 C 506 414 494 414 488 422 C 478 436 482 458 482 458 Z" 
        fill="#E51B24" />
  <!-- Siren base plate -->
  <rect x="474" y="456" width="52" height="8" rx="2" fill="#FFFFFF" />
  <!-- Siren light highlight -->
  <circle cx="496" cy="426" r="4" fill="#FFFFFF" opacity="0.85" />

  <!-- Slogan Typography -->
  <text x="500" y="730" 
        text-anchor="middle" 
        font-family="'Plus Jakarta Sans', system-ui, sans-serif" 
        font-weight="800" 
        font-size="34" 
        letter-spacing="9">
    <tspan fill="#FFFFFF">EVERY SECOND </tspan>
    <tspan fill="#E51B24">SAVES A LIFE.</tspan>
  </text>
</svg>
